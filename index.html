<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent Leaderboard</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <style>html{background:#0d1117}html[data-theme="light"]{background:#f6f8fa}</style>
  <script>(function(){var t=localStorage.getItem('st_theme')||(window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');document.documentElement.setAttribute('data-theme',t);})();</script>
  <link rel="stylesheet" href="src/shared.css?v=202610182350" />
  <link rel="stylesheet" href="src/trends.css?v=202610190030" />
</head>
<body>

<!-- ── Page loader / skeleton ── -->
<div id="pageLoader">
  <div class="skel-navbar">
    <div class="skel skel-navbar-logo"></div>
    <div class="skel-navbar-right">
      <div class="skel skel-navbar-btn"></div>
      <div class="skel skel-navbar-btn"></div>
      <div class="skel skel-navbar-btn"></div>
    </div>
  </div>
  <div class="skel-hero">
    <div class="skel skel-hero-title"></div>
    <div class="skel skel-hero-sub"></div>
    <div class="skel-pills">
      <div class="skel skel-pill"></div>
      <div class="skel skel-pill"></div>
      <div class="skel skel-pill"></div>
      <div class="skel skel-pill"></div>
    </div>
  </div>
  <div class="skel-grid">
    <div class="skel skel-card"></div><div class="skel skel-card"></div>
    <div class="skel skel-card"></div><div class="skel skel-card"></div>
    <div class="skel skel-card"></div><div class="skel skel-card"></div>
    <div class="skel skel-card"></div><div class="skel skel-card"></div>
    <div class="skel skel-card"></div>
  </div>
</div>

<!-- ── Navbar ── -->
<nav class="navbar" id="navbar"></nav>

<!-- ── Hero ── -->
<div class="hero" id="hero"></div>
<aside class="site-announcement" id="siteAnnouncement"></aside>

<div class="container">

  <!-- MCP usage instructions -->
  <section id="mcpUsage"></section>

  <!-- No data warning -->
  <div id="noData" class="no-data" style="display:none"></div>

  <!-- Category tabs -->
  <div class="tabs-wrap">
    <button class="tabs-scroll-btn tabs-scroll-btn--left hidden" id="tabsScrollBtnLeft" onclick="scrollTabsLeft()" aria-label="Scroll left">‹</button>
    <div class="tabs" id="tabs"></div>
    <button class="tabs-scroll-btn hidden" id="tabsScrollBtn" onclick="scrollTabsRight()" aria-label="Scroll right">›</button>
  </div>

  <!-- Brand spotlight (shown when a specific agent tab is active) -->
  <div id="brandSpotlight"></div>

  <!-- Filter bar -->
  <div id="filterBar"></div>

  <!-- Active filters -->
  <div class="active-filters hidden" id="activeFilters"></div>

  <!-- Use-case chips -->
  <div class="uc-scroller-wrap">
    <button class="uc-scroll-btn uc-scroll-btn--left hidden" id="ucScrollBtnLeft" onclick="scrollUCLeft()" aria-label="Scroll left">‹</button>
    <div class="uc-scroller" id="ucScroller"></div>
    <button class="uc-scroll-btn" id="ucScrollBtn" onclick="scrollUCRight()" aria-label="Scroll right">›</button>
  </div>

  <!-- Grid -->
  <div class="grid" id="grid"></div>

  <!-- List table -->
  <div class="list-scroll"><table class="list-table" id="listTable" style="display:none"></table></div>

  <!-- Pagination -->
  <div class="pagination" id="pagination"></div>

  <!-- Visit counter -->
  <div class="visit-badge" id="visitBadge" role="status" aria-live="polite"></div>

</div>

<dialog id="trend-panel" class="trend-panel" aria-labelledby="trend-title">
  <div class="trend-panel-header">
    <div class="trend-heading"><svg class="trend-heading-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m4 16 6-6 4 4 6-9M14 5h6v6"/></svg><h2 id="trend-title">趋势榜</h2><span id="trend-projectsLabel">前 20 名</span></div>
    <div class="trend-panel-actions"><button id="trend-collapse" type="button" aria-label="收起到右下角" title="收起到右下角"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 13h12"/></svg></button><button id="trend-close" type="button" aria-label="关闭趋势榜" title="关闭趋势榜"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15"/></svg></button></div>
  </div>
  <div class="trend-controls">
    <nav id="trend-sourceTabs" class="trend-source-tabs" aria-label="板块"></nav>
    <div class="trend-toolbar">
      <div id="trend-periods" class="trend-periods" role="group" aria-label="时间范围"></div>
      <label class="trend-sort"><span id="trend-sortLabel">排序</span><select id="trend-sort"><option value="rate">增长率</option><option value="delta">新增 Stars</option></select></label>
    </div>
    <div class="trend-summary"><span id="trend-overview" role="status"></span></div>
  </div>
  <div class="trend-columns" aria-hidden="true"><span>#</span><span id="trend-projectColumn">项目</span><span>Stars</span><span id="trend-growthColumn">新增 Stars / 涨幅</span></div>
  <div class="trend-panel-body" id="trend-body">
    <ol id="trend-ranking" class="trend-ranking"></ol>
    <div id="trend-empty" class="trend-empty" hidden></div>
    <footer class="trend-data-footer"><span id="trend-dateRange"></span><details><summary id="trend-methodLabel">如何计算</summary><p id="trend-methodText"></p></details></footer>
  </div>
</dialog>
<div class="trend-dock" id="trend-dock" hidden><button id="trend-expand" type="button" aria-haspopup="dialog" aria-controls="trend-panel">↗ 展开趋势榜</button><button id="trend-dismiss" type="button" aria-label="关闭趋势榜">×</button></div>

<div class="footer">
  Data sourced from <a href="https://docs.github.com/en/rest/search" target="_blank">GitHub Search API</a> · Updated daily ·
  <a href="#" id="ghFooterLink" target="_blank" rel="noopener noreferrer">GitHub</a>
  · <a href="privacy/en.html" id="privacyFooterLink">Privacy policy</a>
</div>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const el = document.getElementById('ghFooterLink');
    if (el && typeof GITHUB_REPO !== 'undefined') el.href = GITHUB_REPO;
  });
</script>

<script src="data/data.js?v=202610240706"></script>
<script src="data/mcp_data.js?v=202610240710"></script>
<script src="data/frameworks_data.js?v=202610240709"></script>
<script src="data/prompts_data.js?v=202610240712"></script>
<script src="data/auto_research_data.js?v=202610240713"></script>
<script src="src/shared.js?v=20261023-visits"></script>
<script src="data/trends.js?v=202610240713"></script>
<script src="src/trends.js?v=202610190030"></script>
</body>
</html>
